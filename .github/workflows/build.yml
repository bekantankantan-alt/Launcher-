name: Build GUNDAM EWALLET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager

      - name: Accept SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true

      - name: Install SDK Packages
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
          "platforms;android-35" \
          "build-tools;35.0.0"

      - name: Check ZIP
        run: |
          ls -lh
          test -f GUNDAM_EWALLET_ANDROID_SINGLE_UPLOAD.zip

      - name: Extract Project
        run: |
          unzip -o GUNDAM_EWALLET_ANDROID_SINGLE_UPLOAD.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUNDAM-EWALLET-DEBUG-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
