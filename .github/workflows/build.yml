name: Build GUNDAM EWALLET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check ZIP
        run: |
          test -f GUNDAM_EWALLET_ANDROID_SINGLE_UPLOAD.zip

      - name: Extract Project
        run: |
          unzip -o GUNDAM_EWALLET_ANDROID_SINGLE_UPLOAD.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUNDAM-EWALLET-DEBUG-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
